{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ServiceHub</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="/" class="brand">ServiceHub<span style="color:#D7B982">.</span></a>
            <a href="{% url 'index' %}" class="text-white text-decoration-none small">
                Back to Home
            </a>
        </div>
    </nav>

    

    <!-- Registration Form -->
    <main class="register-wrapper">
        <div class="register-card">

            <div class="text-center mb-4">
                <h2 class="register-title">Create your account</h2>
                <p class="text-secondary mb-0">
                    Join ServiceHub and find trusted professionals.
                </p>
            </div>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{% url 'register' %}" id="registerForm">
                {% csrf_token %}

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        Full Name
                    </label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           autocomplete="name"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="you@example.com"
                           autocomplete="email"
                           required>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label">
                        Mobile Number
                    </label>
                    <input type="tel"
                           class="form-control"
                           id="phone"
                           name="phone"
                           placeholder="Enter your mobile number"
                           autocomplete="tel"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           inputmode="numeric"
                           title="Enter a 10-digit mobile number"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Create a strong password"
                           autocomplete="new-password"
                           minlength="8"
                           required>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password"
                           class="form-control"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="Enter your password again"
                           autocomplete="new-password"
                           minlength="8"
                           required>
                    <div id="passwordError"
                         class="text-danger small mt-2"
                         style="display:none;">
                        Passwords do not match.
                    </div>
                </div>

                <!-- Terms -->
                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           id="terms"
                           required>
                    <label class="form-check-label small"
                           for="terms">
                        I agree to the Terms of Service and Privacy Policy.
                    </label>
                </div>

                <button type="submit"
                        class="btn btn-register w-100">
                    Create Account
                </button>

                <p class="text-center text-secondary mt-4 mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}" class="login-link">
                        Log in
                    </a>
                </p>
            </form>

        </div>
    </main>

    <!-- Password Match Validation -->
    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        const passwordError = document.getElementById("passwordError");

        function checkPasswords() {
            if (confirmPassword.value && password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("Passwords do not match");
                passwordError.style.display = "block";
            } else {
                confirmPassword.setCustomValidity("");
                passwordError.style.display = "none";
            }
        }

        password.addEventListener("input", checkPasswords);
        confirmPassword.addEventListener("input", checkPasswords);

        form.addEventListener("submit", function(event) {
            checkPasswords();

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });
    </script>

</body>
</html>
